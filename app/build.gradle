plugins { id 'com.android.application' }

android {
    namespace 'br.com.thalyssonjsg.biblia'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.thalyssonjsg.biblia'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Esta versão usa apenas APIs do Android no código da tela inicial.
// Isso reduz dependências externas e evita falhas de inicialização em alguns aparelhos.
dependencies { }
